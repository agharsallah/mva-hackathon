<svg xmlns="http://www.w3.org/2000/svg" width="760" height="275" viewBox="0 0 760 275" role="img" aria-label="Protein domain map with two alleles"><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111}
.b{stroke:#333;stroke-width:1.5;fill:none}
.g{stroke:#999;stroke-width:1;fill:none}
</style><rect x="0.5" y="0.5" width="759" height="274" rx="10" fill="#ffffff" stroke="#d5d5d5"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c00"/></marker></defs><text xml:space="preserve" x="20" y="32" font-size="15px" text-anchor="start" font-weight="700">Inside one protein: BubR1, 1050 amino acid beads</text><rect x="70" y="96" width="620" height="34" rx="6" fill="#e6e6e6" stroke="#333" stroke-width="1.5"/><rect x="85" y="96" width="11" height="34" fill="#ff9999" stroke="#333"/><text xml:space="preserve" x="90" y="86" font-size="10px" text-anchor="middle" fill="#555">KEN-box</text><rect x="105" y="96" width="83" height="34" fill="#cfe8ff" stroke="#333"/><text xml:space="preserve" x="146" y="86" font-size="10px" text-anchor="middle" fill="#555">TPR</text><rect x="306" y="96" width="29" height="34" fill="#ccebc5" stroke="#333"/><text xml:space="preserve" x="320" y="86" font-size="10px" text-anchor="middle" fill="#555">Bub3-binding</text><rect x="530" y="96" width="160" height="34" fill="#e0d4f7" stroke="#333"/><text xml:space="preserve" x="610" y="86" font-size="10px" text-anchor="middle" fill="#555">pseudo-kinase</text><text xml:space="preserve" x="70" y="148" font-size="10px" text-anchor="middle" fill="#555">1</text><text xml:space="preserve" x="217" y="148" font-size="10px" text-anchor="middle" fill="#555">250</text><text xml:space="preserve" x="365" y="148" font-size="10px" text-anchor="middle" fill="#555">500</text><text xml:space="preserve" x="512" y="148" font-size="10px" text-anchor="middle" fill="#555">750</text><text xml:space="preserve" x="690" y="148" font-size="10px" text-anchor="middle" fill="#555">1050</text><line x1="247" y1="184" x2="247" y2="136" stroke="#c00" stroke-width="1.6" marker-end="url(#ar)"/><text xml:space="preserve" x="247" y="204" font-size="10px" text-anchor="middle" fill="#555">allele 1: stop codon at 300</text><text xml:space="preserve" x="247" y="217" font-size="10px" text-anchor="middle" fill="#555">= NULL, no protein</text><line x1="601" y1="184" x2="601" y2="136" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text xml:space="preserve" x="591" y="204" font-size="10px" text-anchor="middle" fill="#555">allele 2: missense in the kinase</text><text xml:space="preserve" x="591" y="217" font-size="10px" text-anchor="middle" fill="#555">= HYPOMORPH, still partly works</text><rect x="20" y="232" width="720" height="29" rx="6" fill="#ffe9b3" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="380" y="252" font-size="12px" text-anchor="middle">Same gene, two very different alleles. WHERE the variant lands decides null versus leaky.</text></svg>