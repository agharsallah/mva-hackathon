</style><rect x="0.5" y="0.5" width="759" height="282" rx="10" fill="#ffffff" stroke="#d5d5d5"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c00"/></marker></defs><text xml:space="preserve" x="20" y="32" font-size="15px" text-anchor="start" font-weight="700">Each submission deletes possibilities</text><rect x="70" y="76" width="560" height="30" rx="5" fill="#ffcccc" stroke="#333"/><text xml:space="preserve" x="70" y="70" font-size="11px" text-anchor="start" fill="#555">50 candidates = 1225 possible pairs</text><text xml:space="preserve" x="740" y="96" font-size="10px" text-anchor="end" fill="#555">10.3 bits unknown</text><line x1="46" y1="106" x2="46" y2="134" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="70" y="134" width="304" height="30" rx="5" fill="#ffe9b3" stroke="#333"/><text xml:space="preserve" x="70" y="128" font-size="11px" text-anchor="start" fill="#555">after probe S: one allele known, 49 pairs left</text><text xml:space="preserve" x="740" y="154" font-size="10px" text-anchor="end" fill="#555">5.6 bits unknown</text><line x1="46" y1="164" x2="46" y2="192" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="70" y="192" width="14" height="30" rx="5" fill="#8fd18f" stroke="#333"/><text xml:space="preserve" x="70" y="186" font-size="11px" text-anchor="start" fill="#555">after probe P: exactly 1 pair left</text><text xml:space="preserve" x="740" y="212" font-size="10px" text-anchor="end" fill="#555">0 bits - solved</text><rect x="20" y="240" width="720" height="29" rx="6" fill="#ccebc5" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="380" y="260" font-size="12px" text-anchor="middle">Three questions crush 1225 possibilities down to 1. You are given eighteen questions.</text></svg>