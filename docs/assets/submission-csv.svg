</style><rect x="0.5" y="0.5" width="759" height="323" rx="10" fill="#ffffff" stroke="#d5d5d5"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c00"/></marker></defs><text xml:space="preserve" x="20" y="30" font-size="15px" text-anchor="start" font-weight="700">Anatomy of one submission row</text><rect x="20" y="48" width="104" height="32" fill="#efefef" stroke="#333"/><text xml:space="preserve" x="72" y="68" font-size="10px" text-anchor="middle">proband_id</text><rect x="20" y="80" width="104" height="30" fill="#e6e6e6" stroke="#333"/><text xml:space="preserve" x="72" y="100" font-size="10px" text-anchor="middle">PROBAND01</text><rect x="20" y="110" width="104" height="30" fill="#e6e6e6" stroke="#333" opacity="0.55"/><text xml:space="preserve" x="72" y="130" font-size="10px" text-anchor="middle">PROBAND01</text><rect x="124" y="48" width="168" height="32" fill="#efefef" stroke="#333"/><text xml:space="preserve" x="208" y="68" font-size="10px" text-anchor="middle">chrom_1 pos_1 ref_1 alt_1</text><rect x="124" y="80" width="168" height="30" fill="#cfe8ff" stroke="#333"/><text xml:space="preserve" x="208" y="100" font-size="10px" text-anchor="middle">chr15 40162526 C T</text><rect x="124" y="110" width="168" height="30" fill="#cfe8ff" stroke="#333" opacity="0.55"/><text xml:space="preserve" x="208" y="130" font-size="10px" text-anchor="middle">chr7 300000 C T</text><rect x="292" y="48" width="168" height="32" fill="#efefef" stroke="#333"/><text xml:space="preserve" x="376" y="68" font-size="10px" text-anchor="middle">chrom_2 pos_2 ref_2 alt_2</text><rect x="292" y="80" width="168" height="30" fill="#e0d4f7" stroke="#333"/><text xml:space="preserve" x="376" y="100" font-size="10px" text-anchor="middle">chr15 40170001 G A</text><rect x="292" y="110" width="168" height="30" fill="#e0d4f7" stroke="#333" opacity="0.55"/><text xml:space="preserve" x="376" y="130" font-size="10px" text-anchor="middle">(blank)</text><rect x="460" y="48" width="64" height="32" fill="#efefef" stroke="#333"/><text xml:space="preserve" x="492" y="68" font-size="10px" text-anchor="middle">epcr</text><rect x="460" y="80" width="64" height="30" fill="#ffe9b3" stroke="#333"/><text xml:space="preserve" x="492" y="100" font-size="10px" text-anchor="middle">0.95</text><rect x="460" y="110" width="64" height="30" fill="#ffe9b3" stroke="#333" opacity="0.55"/><text xml:space="preserve" x="492" y="130" font-size="10px" text-anchor="middle">0.30</text><rect x="524" y="48" width="98" height="32" fill="#efefef" stroke="#333"/><text xml:space="preserve" x="573" y="68" font-size="10px" text-anchor="middle">finding_type</text><rect x="524" y="80" width="98" height="30" fill="#ccebc5" stroke="#333"/><text xml:space="preserve" x="573" y="100" font-size="10px" text-anchor="middle">primary</text><rect x="524" y="110" width="98" height="30" fill="#ccebc5" stroke="#333" opacity="0.55"/><text xml:space="preserve" x="573" y="130" font-size="10px" text-anchor="middle">secondary</text><rect x="622" y="48" width="128" height="32" fill="#efefef" stroke="#333"/><text xml:space="preserve" x="686" y="68" font-size="10px" text-anchor="middle">notes</text><rect x="622" y="80" width="128" height="30" fill="#ffd8a8" stroke="#333"/><text xml:space="preserve" x="686" y="100" font-size="10px" text-anchor="middle">(blank)</text><rect x="622" y="110" width="128" height="30" fill="#ffd8a8" stroke="#333" opacity="0.55"/><text xml:space="preserve" x="686" y="130" font-size="10px" text-anchor="middle">ACMG SF finding</text><line x1="72" y1="192" x2="72" y2="144" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text xml:space="preserve" x="72" y="206" font-size="10px" text-anchor="middle" fill="#555">exactly</text><text xml:space="preserve" x="72" y="219" font-size="10px" text-anchor="middle" fill="#555">PROBAND01,</text><text xml:space="preserve" x="72" y="232" font-size="10px" text-anchor="middle" fill="#555">case-sensitive</text><line x1="208" y1="192" x2="208" y2="144" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text xml:space="preserve" x="208" y="206" font-size="10px" text-anchor="middle" fill="#555">chr-prefixed: chr15, not</text><text xml:space="preserve" x="208" y="219" font-size="10px" text-anchor="middle" fill="#555">15. normalized spelling</text><text xml:space="preserve" x="208" y="232" font-size="10px" text-anchor="middle" fill="#555">only</text><line x1="376" y1="192" x2="376" y2="144" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text xml:space="preserve" x="376" y="206" font-size="10px" text-anchor="middle" fill="#555">the SECOND variant of the</text><text xml:space="preserve" x="376" y="219" font-size="10px" text-anchor="middle" fill="#555">pair. blank =</text><text xml:space="preserve" x="376" y="232" font-size="10px" text-anchor="middle" fill="#555">single-variant row</text><line x1="492" y1="192" x2="492" y2="144" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text xml:space="preserve" x="492" y="206" font-size="10px" text-anchor="middle" fill="#555">distinct,</text><text xml:space="preserve" x="492" y="219" font-size="10px" text-anchor="middle" fill="#555">descending,</text><text xml:space="preserve" x="492" y="232" font-size="10px" text-anchor="middle" fill="#555">inside 0</text><text xml:space="preserve" x="492" y="245" font-size="10px" text-anchor="middle" fill="#555">to 1</text><line x1="573" y1="192" x2="573" y2="144" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text xml:space="preserve" x="573" y="206" font-size="10px" text-anchor="middle" fill="#555">primary or</text><text xml:space="preserve" x="573" y="219" font-size="10px" text-anchor="middle" fill="#555">secondary. zero</text><text xml:space="preserve" x="573" y="232" font-size="10px" text-anchor="middle" fill="#555">effect on the</text><text xml:space="preserve" x="573" y="245" font-size="10px" text-anchor="middle" fill="#555">score</text><line x1="686" y1="192" x2="686" y2="144" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text xml:space="preserve" x="686" y="206" font-size="10px" text-anchor="middle" fill="#555">free text - humans</text><text xml:space="preserve" x="686" y="219" font-size="10px" text-anchor="middle" fill="#555">DO read this</text><rect x="20" y="264" width="720" height="46" rx="6" fill="#ffcccc" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="380" y="284" font-size="12px" text-anchor="middle">A malformed CSV burns one of only 18 irreplaceable submissions. Validate every file locally</text><text xml:space="preserve" x="380" y="301" font-size="12px" text-anchor="middle">against your own copy of the scorer first.</text></svg>