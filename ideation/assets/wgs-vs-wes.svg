0" y="198" font-size="11px" text-anchor="start" fill="#555">green = exons, about 2 percent of the book.   gray and blue = introns and the gaps between genes.</text><rect x="20" y="214" width="720" height="46" rx="6" fill="#ffcccc" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="380" y="234" font-size="12px" text-anchor="middle">This case is WGS. So a deep-intronic second allele is possible - and that is exactly the</text><text xml:space="preserve" x="380" y="251" font-size="12px" text-anchor="middle">designed trap.</text></svg>