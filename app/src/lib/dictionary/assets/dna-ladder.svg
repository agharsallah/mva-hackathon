<svg xmlns="http://www.w3.org/2000/svg" width="760" height="235" viewBox="0 0 760 235" role="img" aria-label="DNA ladder with base pairs"><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111}
.b{stroke:#333;stroke-width:1.5;fill:none}
.g{stroke:#999;stroke-width:1;fill:none}
</style><rect x="0.5" y="0.5" width="759" height="234" rx="10" fill="#ffffff" stroke="#d5d5d5"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c00"/></marker></defs><text xml:space="preserve" x="20" y="32" font-size="15px" text-anchor="start" font-weight="700">DNA is a 4-letter ladder</text><line x1="46" y1="82" x2="626" y2="82" stroke="#666" stroke-width="5"/><line x1="46" y1="172" x2="626" y2="172" stroke="#666" stroke-width="5"/><line x1="76" y1="82" x2="76" y2="172" stroke="#bbb" stroke-width="2"/><rect x="60" y="96" width="32" height="26" rx="6" fill="#ffd8a8" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="76" y="114" font-size="13px" text-anchor="middle">A</text><rect x="60" y="132" width="32" height="26" rx="6" fill="#cfe8ff" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="76" y="150" font-size="13px" text-anchor="middle">T</text><line x1="146" y1="82" x2="146" y2="172" stroke="#bbb" stroke-width="2"/><rect x="130" y="96" width="32" height="26" rx="6" fill="#ccebc5" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="146" y="114" font-size="13px" text-anchor="middle">C</text><rect x="130" y="132" width="32" height="26" rx="6" fill="#e0d4f7" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="146" y="150" font-size="13px" text-anchor="middle">G</text><line x1="216" y1="82" x2="216" y2="172" stroke="#bbb" stroke-width="2"/><rect x="200" y="96" width="32" height="26" rx="6" fill="#e0d4f7" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="216" y="114" font-size="13px" text-anchor="middle">G</text><rect x="200" y="132" width="32" height="26" rx="6" fill="#ccebc5" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="216" y="150" font-size="13px" text-anchor="middle">C</text><line x1="2