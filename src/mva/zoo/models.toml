licence = "CADD non-commercial (free for academic use, licence required otherwise)"
licence_url = "https://cadd.gs.washington.edu/download"
non_commercial = true
catalogue_adjacent = true
pmid = "38183205"
scope = "mvp"
enabled = false
notes = """
The alternate for the catalogue-adjacent lane (plan open question O5), kept off.
Ensembl's REST docs list a `CADD` parameter (values snv | indels | snv_indels | sv | 1), but
the public REST service answered HTTP 500 for it in iteration 2 (entry 098) — the plugin data
file is not installed on the public endpoint. REVEL carries the lane instead. Re-enable only
if a run shows the endpoint answering; the disagreement between REVEL and CADD would be a
free second adjacent opinion.
"""

