[project]
name = "mva"
version = "0.1.0"
description = "N-of-1 causal variant pipeline for the MVA Hackathon 2026 proband"
requires-python = ">=3.10"
dependencies = [
    "plotly>=7.0.0",
]

[project.scripts]
mva-explore = "mva.explore.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
