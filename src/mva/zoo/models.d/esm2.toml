# src/mva/zoo/models.d/esm2.toml — the zoo's first tier-2 lane (wave 4, opt-A row A1).
#
# ESM2 650M is the first model in this zoo that is not a lookup: nothing was precomputed by
# anyone, the weights run here, on this laptop's CPU, over the protein windows step 1 now
# builds. That is what makes it the zoo's only *unambiguously* catalogue-free opinion on a
# missense allele — it was trained on ~65 million natural protein sequences and on no variant
# labels at all, so there is no ClinVar in its past to leak.
#
# `checkpoint` is the published artefact, spelled as Hugging Face names it; the adapter
# records the sha256 of the weights file it actually loaded in every score row's `digest`.
#
# `score_sign = -1`: the lane emits a masked-marginal log-likelihood ratio, log P(mutant) −
# log P(reference), which is <= 0 and *more negative for a worse substitution*. The zoo's
# one convention is "higher = more damaging", so the adapter negates it. The raw published
# number is kept in `aux.llr` so nothing is lost.
#
# `batch = 8`: eight 129-residue windows per forward pass fit beside a 650M-parameter model
# in 16 GiB. Raising it costs memory, not accuracy — each allele is scored independently.
#
# Licence MIT, read from the model repository, not from a search result.
[models.esm2]
enabled = true
params = { entrypoint = "esm2", checkpoint = "facebook/esm2_t33_650M_UR50D", batch = 8, score_sign = -1, needs = [
  "protein_window_ref",
  "protein_window_alt",
] }
