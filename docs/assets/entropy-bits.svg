<svg xmlns="http://www.w3.org/2000/svg" width="760" height="283" viewBox="0 0 760 283" role="img" aria-label="Hypothesis space shrinking with each probe"><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111}
.b{stroke:#333;stroke-width:1.5;fill:none}
