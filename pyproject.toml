[project]
name = "mva"
version = "0.1.0"
description = "N-of-1 causal variant pipeline for the MVA Hackathon 2026 proband"
requires-python = ">=3.11,<3.15"
dependencies = [
    "boto3>=1.43.83",
    "duckdb>=1.5.5",
    "dysgu>=1.9.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "huggingface-hub>=1.29.0",
    "numpy>=2.0",
    "plotly>=7.0.0",
    "polars>=1.44.1",
    "pyarrow>=24.0.0",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "truvari>=5.4.0",
    "uvicorn>=0.30",
    "whatshap>=2.8",
]

[project.scripts]
mva-explore = "mva.explore.cli:main"
mva-warehouse = "mva.warehouse.cli:main"
mva-phenotype = "mva.phenotype.cli:main"
mva-drugs = "mva.drugs.cli:main"
mva-science = "mva.science.cli:main"
mva-reads = "mva.reads.cli:main"
mva-reads-api = "mva.reads.api.serve:main"
mva-viz-api = "mva.viz.serve:main"
mva-zoo = "mva.zoo.cli:main"

[dependency-groups]
bench = [
    "aiohttp>=3.14.3",
    "oxbow>=0.8.1",
    "polars-bio>=0.35.1",
]
dev = [
    "httpx>=0.27",
    "import-linter>=2.14",
    "kaleido>=1.4.0",
    "markdown>=3.10.3",
    "mypy>=2.3.1",
    "openpyxl>=3.1.5",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not slow'"
markers = [
    "slow: nested-optimisation fits that take double-digit seconds each; run with `-m slow`",
]

# ---------------------------------------------------------------------------------------
# Ruff — linter and formatter. See docs/notes/python-quality-gates.md for why each block
# is set the way it is; the short version is in the comments here.
# ---------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]
# archive/ is provenance and never edited; build/ and figures/ are generated.
# .claude/skills/ ships third-party skill scripts, outside this repo's own style.
extend-exclude = ["archive", "build", "figures", "ressources", ".claude"]
# The pre-commit hook passes staged files explicitly; force-exclude makes
# extend-exclude apply to those too, not just directory-walk discovery.
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle: whitespace, line length
    "F",           # pyflakes: undefined names, unused imports, f-string mistakes
    "I",           # isort: one import order, enforced
    "N",           # pep8-naming
    "UP",          # pyupgrade: no syntax older than the floor in requires-python
    "B",           # bugbear: mutable defaults, loop-variable capture, zip without strict
    "A",           # builtin shadowing
    "C4",          # comprehension rewrites
    "SIM",         # simplifiable constructs
    "RET",         # return-path hygiene
    "PERF",        # obvious algorithmic waste
    "PTH",         # pathlib over os.path
    "RUF",         # ruff's own rules
    "DTZ",         # naive datetimes — every timestamp this repo writes must be tz-aware
    "ISC",         # implicit string concatenation (a missing comma in a list, mainly)
    "LOG", "G",    # logging call hygiene
    "PIE",         # small correctness/readability wins
    "SLF",         # private-member access across object boundaries
    "T10",         # no leftover debugger breakpoints
    "ASYNC",       # blocking calls inside async def
    "FA",          # future annotations where the syntax needs them
    "EXE",         # shebang/executable-bit agreement
    "YTT",         # sys.version_info misuse
    "PLE",         # pylint errors
    "PLW",         # pylint warnings
    "PLC",         # pylint conventions
    "PLR0912",     # too many branches
    "PLR0915",     # too many statements
    "PLR1714",     # repeated equality comparison
    "TRY",         # exception-handling anti-patterns
]
ignore = [
    # Every rule below is off for a stated reason, not because it was noisy.
    "TID252",   # relative imports: intra-package imports here are relative on purpose,
                # so a package can be moved without rewriting its own internals.
    "ARG",      # unused arguments: CLI handlers (`do_x(args)`) and job runners
                # (`run(job)`) conform to a signature their dispatcher calls. The unused
                # parameter *is* the interface; renaming it to `_args` hides that.
    "C408",     # dict(...) calls: plotly's own API and docs are written in the
                # dict(color=..., line=dict(...)) style, and quoted keys read worse in
                # the figure code where nearly all of these live.
    "TRY003",   # long messages outside an exception class: the message at the raise site
                # is usually the only place the caller's context is known.
    "PLC0415",  # imports inside functions: deliberate here, and load-bearing — heavy or
                # optional dependencies (uvicorn, httpx, duckdb, plotly) stay out of
                # import time, and `mva.science` reaches `mva.warehouse` lazily so the
                # register works with no database driver installed.
    "RUF001", "RUF002", "RUF003",  # "ambiguous" unicode: the docs and docstrings use
                # real en dashes and arrows deliberately.
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use magic numbers as fixtures, and reach into internals on purpose.
"tests/**" = ["SLF001", "PLR2004"]
# One-shot data-prep scripts print to stdout; that is their interface.
"tools/**" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["mva"]

[tool.ruff.format]
# Adopted deliberately in one pass rather than left to per-author wrapping; the
# reformat commit is the only place style appears in git blame.
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------------------------------
# mypy — type checking. Strict where the code is already annotated, permissive elsewhere,
# and the permissive list is a ratchet: entries come off it, never onto it.
# ---------------------------------------------------------------------------------------
[tool.mypy]
# No `python_version` pin: numpy's bundled stubs use `type` statements, which are 3.12+
# syntax, so pinning 3.11 makes mypy fail inside numpy before it reaches our code. The
# 3.11 floor from requires-python is enforced instead by ruff's `target-version = py311`,
# which rejects any syntax or stdlib API newer than that.
files = ["src/mva", "tools"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
strict = true
# Third-party genomics/plotting libraries ship no stubs; that is theirs to fix, not ours.
ignore_missing_imports = true
warn_unused_configs = true
pretty = true
# --- The ratchet ---------------------------------------------------------------------
# Full `strict` over 30k lines that predate it is 522 errors, 496 of which are missing
# annotations rather than type mistakes. So the four annotation-completeness flags are
# off by default and turned back ON per package once that package is annotated. Entries
# come off this list, never onto it: a package that is strict stays strict.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

# Packages already clean under the full ruleset. Add the next one here when it is.
[[tool.mypy.overrides]]
module = [
    "mva.calling.*",
    "mva.drugs.*",
    "mva.io.*",
    "mva.kmer.*",
    "mva.knowledge.*",
    "mva.phenotype.*",
    "mva.render.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true

# ---------------------------------------------------------------------------------------
# import-linter — the package layering from src/mva/README.md, enforced. Without this the
# dependency graph is a diagram in a README that nothing checks.
# ---------------------------------------------------------------------------------------
[tool.importlinter]
root_package = "mva"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "No import cycles between packages"
type = "layers"
layers = [
    "mva.viz",
    "mva.explore | mva.report",
    "mva.science | mva.zoo",
    "mva.reads",
    "mva.warehouse",
    "mva.knowledge",
    "mva.phenotype | mva.drugs | mva.mosaic",
    "mva.pipeline | mva.io | mva.calling | mva.kmer | mva.render",
]
# mva.mosaic sits on the phenotype/drugs row because it reuses two things below it -- the
# negative-binomial fit in mva.kmer.genotype and the bootstrap convention in
# mva.pipeline.nulls -- and is read by mva.warehouse above it. It imports neither of its
# row-mates and neither imports it.
# A layer may import anything below it and nothing above it. mva.pipeline, mva.io,
# mva.kmer and mva.render sit on the bottom row together because none of them imports any
# of the others; they are the leaves. mva.knowledge sits between mva.warehouse and
# mva.drugs because it is the one package that reuses another's source adapters: it
# reads public literature APIs through mva.drugs.cache.Fetcher and
# mva.drugs.sources.pubmed rather than owning a second HTTP client. mva.kmer is pure NumPy arithmetic over reference
# sequence and is imported by mva.reads one row above it. mva.phenotype sits one row above them: it parses public
# ontology files (mva.io) and hands a gene prior to the pair ranker (mva.pipeline), and
# nothing in either of those may reach back up to it. mva.drugs shares that row: it reads
# seven public drug and pathway APIs and imports no sibling package at all, so it neither
# depends on mva.phenotype nor may be imported by it.
exhaustive = false

[[tool.importlinter.contracts]]
name = "The leaf packages import no sibling package"
type = "forbidden"
source_modules = ["mva.calling", "mva.io", "mva.kmer", "mva.pipeline", "mva.render"]
forbidden_modules = [
    "mva.explore",
    "mva.reads",
    "mva.science",
    "mva.viz",
    "mva.warehouse",
]

[[tool.importlinter.contracts]]
name = "Nothing depends on the web layer"
type = "forbidden"
source_modules = [
    "mva.drugs",
    "mva.explore",
    "mva.io",
    "mva.mosaic",
    "mva.phenotype",
    "mva.pipeline",
    "mva.reads",
    "mva.render",
    "mva.science",
    "mva.warehouse",
    "mva.zoo",
]
forbidden_modules = ["mva.viz"]
