<svg xmlns="http://www.w3.org/2000/svg" width="760" height="332" viewBox="0 0 760 332" role="img" aria-label="MVA genes on chromosomes 5, 11 and 15"><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111}
.b{stroke:#333;stroke-width:1.5;fill:none}
.g{stroke:#999;stroke-width:1;fill:none}
</style><rect x="0.5" y="0.5" width="759" height="331" rx="10" fill="#ffffff" stroke="#d5d5d5"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c00"/></marker></defs><text xml:space="preserve" x="20" y="32" font-size="15px" text-anchor="start" font-weight="700">Where the MVA genes live</text><text xml:space="preserve" x="92" y="52" font-size="13px" text-anchor="middle">chr5</text><rect x="70" y="58" width="44" height="66" rx="20" fill="#cfe8ff" stroke="#333" stroke-width="1.5"/><ellipse cx="92" cy="134" rx="13" ry="8" fill="#999" stroke="#333"/><rect x="70" y="142" width="44" height="116" rx="20" fill="#cfe8ff" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="332" y="52" font-size="13px" text-anchor="middle">chr11</text><rect x="310" y="58" width="44" height="58" rx="20" fill="#cfe8ff" stroke="#333" stroke-width="1.5"/><ellipse cx="332" cy="126" rx="13" ry="8" fill="#999" stroke="#333"/><rect x="310" y="134" width="44" height="124" rx="20" fill="#cfe8ff" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="572" y="52" font-size="13px" text-anchor="middle">chr15</text><rect x="550" y="58" width="44" height="44" rx="20" fill="#cfe8ff" stroke="#333" stroke-width="1.5"/><ellipse cx="572" cy="112" rx="13" ry="8" fill="#999" stroke="#333"/><rect x="550" y="120" width="44" height="138" rx="20" fill="#cfe8ff" stroke="#333" stroke-width="1.5"/><circle cx="114" cy="70" r="9" fill="#ffd8a8" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="130" y="69" font-size="13px" text-anchor="start">TRIP13</text><text xml:space="preserve" x="130" y="83" font-size="10px" text-anchor="start" fill="#555">5p15.33 - 20%</text><circle cx="354" cy="180" r="8" fill="#ccebc5" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="370" y="179" font-size="13px" text-anchor="start">CEP57</text><text xml:space="preserve" x="370" y="193" font-size="10px" text-anchor="start" fill="#555">11q21 - 5%</text><circle cx="594" cy="136" r="12" fill="#ff9999" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="610" y="135" font-size="13px" text-anchor="start">BUB1B</text><text xml:space="preserve" x="610" y="149" font-size="10px" text-anchor="start" fill="#555">15q15.1 - 55%</text><rect x="20" y="272" width="720" height="46" rx="6" fill="#ffe9b3" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="380" y="292" font-size="12px" text-anchor="middle">KNL1 sits at 15q15.1 too, right next to BUB1B. A chr15 hit is NOT automatically BUB1B - always</text><text xml:space="preserve" x="380" y="309" font-size="12px" text-anchor="middle">check the transcript.</text></svg>