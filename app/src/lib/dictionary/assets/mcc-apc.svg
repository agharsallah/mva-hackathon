<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-label="Mitotic checkpoint complex inhibiting APC/C"><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111}
.b{stroke:#333;stroke-width:1.5;fill:none}
.g{stroke:#999;stroke-width:1;fill:none}
</style><rect x="0.5" y="0.5" width="759" height="389" rx="10" fill="#ffffff" stroke="#d5d5d5"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c00"/></marker></defs><text xml:space="preserve" x="20" y="32" font-size="15px" text-anchor="start" font-weight="700">The STOP signal: how the checkpoint holds the cell back</text><rect x="380" y="48" width="150" height="38" rx="6" fill="#e0d4f7" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="455" y="72" font-size="13px" text-anchor="middle">TRIP13</text><text xml:space="preserve" x="544" y="62" font-size="10px" text-anchor="start" fill="#555">resets MAD2's shape so the STOP</text><text xml:space="preserve" x="544" y="76" font-size="10px" text-anchor="start" fill="#555">signal can be built again and</text><text xml:space="preserve" x="544" y="90" font-size="10px" text-anchor="start" fill="#555">again</text><line x1="455" y1="88" x2="455" y2="110" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="112" width="150" height="44" rx="6" fill="#cfe8ff" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="115" y="131" font-size="13px" text-anchor="middle">BUBR1</text><text xml:space="preserve" x="115" y="146" font-size="10px" text-anchor="middle" fill="#555">made by BUB1B</text><rect x="210" y="112" width="150" height="44" rx="6" fill="#cfe8ff" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="285" y="139" font-size="13px" text-anchor="middle">BUB3</text><rect x="380" y="112" width="150" height="44" rx="6" fill="#cfe8ff" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="455" y="139" font-size="13px" text-anchor="middle">MAD2</text><rect x="550" y="112" width="150" height="44" rx="6" fill="#cfe8ff" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="625" y="139" font-size="13px" text-anchor="middle">CDC20</text><line x1="285" y1="158" x2="285" y2="190" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="455" y1="158" x2="455" y2="190" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="115" y1="158" x2="212" y2="190" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="625" y1="158" x2="548" y2="190" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="210" y="192" width="340" height="44" rx="6" fill="#ffe9b3" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="380" y="211" font-size="13px" text-anchor="middle">MCC</text><text xml:space="preserve" x="380" y="226" font-size="10px" text-anchor="middle" fill="#555">the STOP signal</text><line x1="380" y1="236" x2="380" y2="266" stroke="#333" stroke-width="2"/><line x1="364" y1="266" x2="396" y2="266" stroke="#333" stroke-width="5"/><text xml:space="preserve" x="392" y="258" font-size="10px" text-anchor="start" fill="#555">blocks</text><rect x="300" y="272" width="160" height="44" rx="6" fill="#e0d4f7" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="380" y="299" font-size="13px" text-anchor="middle">APC/C</text><line x1="462" y1="294" x2="518" y2="294" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="528" y="272" width="180" height="44" rx="6" fill="#ccebc5" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="618" y="299" font-size="12px" text-anchor="middle">the cell splits</text><rect x="20" y="330" width="720" height="46" rx="6" fill="#ffcccc" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="380" y="350" font-size="12px" text-anchor="middle">BUB1B broken -> no MCC -> APC/C is never blocked -> the cell splits before the chromosomes are</text><text xml:space="preserve" x="380" y="367" font-size="12px" text-anchor="middle">ready.</text></svg>