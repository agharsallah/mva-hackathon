# src/mva/zoo/models.d/gpnmsa.toml — the promotion pre-registered in entry 114 (plan §10 R9).
#
# Why this lane exists at all: the confirmed pair is one `missense_variant` and one
# `stop_gained`, and three of the four MVP lanes are missense-only while the fourth is splice.
# No MVP lane can score half the answer. GPN-MSA is a DNA language model whose authors
# published a score for **every** possible single-nucleotide change in GRCh38, so it is the
# first lane in this zoo with an opinion on a nonsense allele — and it is catalogue-free.
#
# `adapter = "coordinate_table"` replaces the roster's `duckdb_lookup`: this table is keyed on
# `chrom/pos/ref/alt`, and the record set that leaves this machine carries no coordinate. The
# lane computes `allele_id` in SQL over the *published* table's own coordinates instead, so
# one side of the join is public data and the other is opaque ids.
#
# `sha256` is **the subset this repository fetched**, not the upstream file — measured by
# `tools/fetch_zoo_tables.py --fetch gpnmsa --subset-from build/it4/records.parquet --execute`
# and printed by it. The upstream file is 37,274,961,495 bytes and was never downloaded; its
# size and ETag are in `build/it4/tables/gpnmsa.subset.provenance.json` beside this digest.
# The subset is 9,316,308 rows over 3,105,436 bases — 0.1 % of the genome, and every one of
# the record set's 35,881 single-nucleotide positions.
#
# `score_sign = -1`: GPN-MSA publishes a number that is **more negative for a more
# deleterious** change (the dataset card's own example runs -1.12 to -1.83 across a
# conserved exon). The zoo's one convention is higher = more damaging, so the adapter
# negates it.
#
# Licence **MIT**, read from the dataset card's own front-matter on 2026-09-20 — the shared
# roster said "check on fetch (Hugging Face dataset card)", and this is that check.
[models.gpnmsa]
enabled = true
adapter = "coordinate_table"
licence = "MIT"
licence_url = "https://huggingface.co/datasets/songlab/gpn-msa-hg38-scores"
params = { sha256 = "ce88426b07b2a02bdebcd1a5e43c24cd5c1c3fbcedaf5f6d6b230b9d2bf4a6d4", columns = [
  "chrom",
  "pos",
  "ref",
  "alt",
], score_column = "score", score_sign = -1 }
