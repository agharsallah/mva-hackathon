="10px" text-anchor="middle" fill="#555">8.5 weeks of work</text><text xml:space="preserve" x="415" y="192" font-size="10px" text-anchor="middle" fill="#555">deletion window</text><text xml:space="preserve" x="590" y="192" font-size="10px" text-anchor="middle" fill="#555">qualitative judging</text><rect x="20" y="206" width="720" height="46" rx="6" fill="#ffcccc" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="380" y="226" font-size="12px" text-anchor="middle">Deletion is a deliverable: local disks, cloud volumes, notebooks, private repo history - then</text><text xml:space="preserve" x="380" y="243" font-size="12px" text-anchor="middle">an email to confirm it.</text></svg>