<svg xmlns="http://www.w3.org/2000/svg" width="760" height="298" viewBox="0 0 760 298" role="img" aria-label="Information content of HPO terms"><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111}
.b{stroke:#333;stroke-width:1.5;fill:none}
.g{stroke:#999;stroke-width:1;fill:none}
</style><rect x="0.5" y="0.5" width="759" height="297" rx="10" fill="#ffffff" stroke="#d5d5d5"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c00"/></marker></defs><text xml:space="preserve" x="20" y="32" font-size="15px" text-anchor="start" font-weight="700">Not all symptoms are worth the same</text><text xml:space="preserve" x="20" y="86" font-size="13px" text-anchor="start">Abnormality of the body</text><rect x="300" y="66" width="11" height="26" rx="5" fill="#e6e6e6" stroke="#333"/><text xml:space="preserve" x="319" y="84" font-size="10px" text-anchor="start" fill="#555">IC 0.3</text><text xml:space="preserve" x="300" y="108" font-size="10px" text-anchor="start" fill="#555">almost everyone has something - tells you nothing</text><text xml:space="preserve" x="20" y="142" font-size="13px" text-anchor="start">Microcephaly</text><rect x="300" y="122" width="159" height="26" rx="5" fill="#cfe8ff" stroke="#333"/><text xml:space="preserve" x="467" y="140" font-size="10px" text-anchor="start" fill="#555">IC 4.2</text><text xml:space="preserve" x="300" y="164" font-size="10px" text-anchor="start" fill="#555">narrows it to a few hundred diseases</text><text xml:space="preserve" x="20" y="198" font-size="13px" text-anchor="start">Wilms tumour in a toddler</text><rect x="300" y="178" width="364" height="26" rx="5" fill="#ff9999" stroke="#333"/><text xml:space="preserve" x="672" y="196" font-size="10px" text-anchor="start" fill="#555">IC 9.6</text><text xml:space="preserve" x="300" y="220" font-size="10px" text-anchor="start" fill="#555">narrows it to a handful</text><rect x="20" y="238" width="720" height="46" rx="6" fill="#ffe9b3" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="380" y="258" font-size="12px" text-anchor="middle">IC = minus log of how often the term appears. A long bar means the term is rare, and a rare</text><text xml:space="preserve" x="380" y="275" font-size="12px" text-anchor="middle">term actually tells you something.</text></svg>