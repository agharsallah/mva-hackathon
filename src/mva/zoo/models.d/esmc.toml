# src/mva/zoo/models.d/esmc.toml — the ESM-C 600M GPU lane (step 8, entry 145).
#
# Runs on Modal (`mva-zoo-esmc`, src/mva/zoo/modal_apps/esmc.py) with the ESM2 lane's
# masked-marginal recipe on the same 129-residue windows, so ESM-C vs ESM2 is an
# apples-to-apples agreement test. `score_sign = -1`: the published number is
# log P(alt) − log P(ref) at the masked position, more negative = more damaging.
#
# Weights biohub/esmc-600m-2024-12 at the pinned revision in the app; `digest` is the
# sha256 tree the container measured over the .pth file (smoke run, entry 145).
[models.esmc]
enabled = true
version = "esmc_600m esm==3.1.1 hf:biohub/esmc-600m-2024-12@e4d83bc7e10f"
params = { digest = "446d3c14628290c8455dd024d2a9a42ace14bea5edd7191153a2166eaf1145ba", image = "esmc", gpu = "L4", batch = 128, wave = 16, score_sign = -1, needs = [
  "protein_window_ref",
  "protein_window_alt",
] }
