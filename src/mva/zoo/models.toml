# The zoo roster — one table per model, read by `mva.zoo.registry`.
#
# This file is the SHARED roster and is edited only when the roster itself changes. A later
# lane, and every measured digest, lands as a fragment in `models.d/<key>.toml` instead, so
# two agents never edit one file (plan §7b, "Shared hot spots").
#
# Fields (all required unless marked optional):
#   name               human name of the model
#   key                the registry key; must equal the table name
#   version            the exact artefact that will be scored against, not the paper version
#   tier               1 = precomputed lookup, 2 = local CPU process, 3 = remote GPU
#   input_class        missense | splice | any | structure | disease-node
#   source             warehouse-column | table | vep-rest | local-process | modal
#   adapter            module under `mva.zoo.adapters` that speaks to this source
#   params             what the adapter needs (see `registry.ADAPTER_PARAMS`)
#   licence            SPDX id where one exists, else the licence's name
#   licence_url        where those terms are published
#   non_commercial     true if the terms forbid commercial use (hackathon use is non-commercial)
#   catalogue_adjacent true if the model was trained on a variant catalogue (ClinVar/HGMD);
#                      the merge is printed with and without these lanes (plan D4)
#   pmid               only PMIDs verified in plan §11; empty string when none is verified yet
#   scope              mvp | opt-a | opt-b (plan §5 step 2)
#   enabled            true only for the four MVP lanes
#   notes              coverage expectation, failure modes, what still needs verifying
#
# "verify on fetch" in `notes` means the URL or the licence text was read from a search result
# or a paper, not from the artefact itself. No digest is ever guessed: `sha256 = ""` means
# nothing has been downloaded, and `tools/fetch_zoo_tables.py` prints the fragment to paste.

# --------------------------------------------------------------------------------------
# MVP lanes — the four that run end-to-end on the laptop (plan P4-2a).
# --------------------------------------------------------------------------------------

[models.alphamissense]
name = "AlphaMissense"
key = "alphamissense"
version = "AlphaMissense hg38 2023"
tier = 1
input_class = "missense"
source = "warehouse-column"
adapter = "warehouse_column"
params = { table = "it2_insilico_annotations", column = "am_pathogenicity", aux = ["am_class"] }
licence = "CC-BY-NC-SA-4.0"
licence_url = "https://zenodo.org/records/8208688"
non_commercial = true
catalogue_adjacent = false
pmid = "37733863"
scope = "mvp"
enabled = true
notes = """
Already in the warehouse: iteration 2 ran the VEP AlphaMissense plugin, so this lane is a
column read and needs no download. 10,601 of 38,087 annotated alleles carry a score — that
is the missense share of a coding callset, not a failure. Coverage is measured against the
missense records only (plan P4-3, target >= 90%). Failure mode: a record whose consequence
is missense but whose row predates the iteration-2 annotation pass reads null.
"""

[models.spliceai]
name = "SpliceAI"
key = "spliceai"
version = "SpliceAI via VEP plugin (iteration 2 annotation pass)"
tier = 1
input_class = "splice"
source = "warehouse-column"
adapter = "warehouse_column"
params = { table = "it2_insilico_annotations", column = "spliceai_ds_max", aux = ["spliceai"] }
licence = "Illumina SpliceAI non-commercial (academic use)"
licence_url = "https://github.com/Illumina/SpliceAI"
non_commercial = true
catalogue_adjacent = false
pmid = "30661751"
scope = "mvp"
enabled = true
notes = """
Also already in the warehouse (32,534 of 38,087 rows non-null) — the second no-download lane.
`spliceai_ds_max` is the maximum delta score over the four events; the raw per-event string is
kept as aux. Iteration 2 used the published delta >= 0.2 recall cut (Z2); the zoo keeps the
raw number and leaves the cut to the ranker. Failure mode: indels outside the precomputed SNV
set read null; the code is GPL-3.0 but the precomputed scores are the non-commercial artefact.
"""

[models.esm1b]
name = "ESM1b variant effects (Brandes 2023)"
key = "esm1b"
version = "Brandes 2023 ESM1b"
tier = 1
input_class = "missense"
source = "table"
adapter = "duckdb_lookup"
params = { key = ["uniprot", "hgvs_p"], url = "https://huggingface.co/spaces/ntranoslab/esm_variants/resolve/main/ALL_hum_isoforms_ESM1b_LLR.zip", sha256 = "", bytes = 1335361543, layout = "matrix-zip", member_glob = "*.csv", score_sign = -1 }
licence = "MIT"
licence_url = "https://github.com/ntranoslab/esm-variants/blob/main/LICENSE"
non_commercial = false
catalogue_adjacent = false
pmid = "37563329"
scope = "mvp"
enabled = true
notes = """
The only MVP lane that downloads. Found 2026-09-18 by listing the authors' Hugging Face Space
tree (https://huggingface.co/api/spaces/ntranoslab/esm_variants/tree/main):
`ALL_hum_isoforms_ESM1b_LLR.zip`, 1,335,361,543 bytes (1.24 GiB) — all ~450M missense effects
over 42,336 human protein isoforms, one CSV matrix per isoform (rows = the 20 amino acids,
columns = position + wild-type residue). Licence read from the code repository (MIT); the
Space itself states no separate data licence — verify on fetch.
The score is a log-likelihood ratio, <= 0, more negative = more damaging, so the adapter
negates it (`score_sign = -1`) to keep the zoo's "higher = more damaging" convention.
Join key: UniProt isoform accession + protein change, so this lane needs step 1's `hgvs_p`
and a UniProt mapping; records without either are uncovered, and that is a reportable number.
"""

[models.revel]
name = "REVEL"
key = "revel"
version = "REVEL 1.3 via VEP REST"
tier = 1
input_class = "missense"
source = "vep-rest"
adapter = "vep_rest"
params = { plugin = "REVEL", endpoint = "https://rest.ensembl.org/vep/human/hgvs", batch = 200 }
licence = "REVEL non-commercial (free for non-commercial use; other uses by arrangement)"
licence_url = "https://sites.google.com/site/revelgenomics/"
non_commercial = true
catalogue_adjacent = true
pmid = "27666373"
scope = "mvp"
enabled = true
notes = """
The catalogue-adjacent lane, and the reason the merge is always printed twice (with and
without adjacent lanes). REVEL is an ensemble trained on catalogued pathogenic/benign sets,
so it has seen labels the other three have not.
Plugin flag verified 2026-09-18 against the Ensembl REST docs for `/vep/human/hgvs`
(https://rest.ensembl.org/documentation/info/vep_hgvs_get): the parameter is spelled `REVEL`
and is boolean (`REVEL=1`). Tier 1 because REST serves a precomputed table; it is the source
that is remote, not the computation.
Failure modes: REST rate limits (batch of 200 per POST, retry on 429); a record with no HGVS
spelling cannot be asked at all.
"""

