# src/mva/zoo/models.d/ntv2.toml — the NT-v2 lane on Modal (iteration 4, step 8, entry 144).
#
# App `mva-zoo-ntv2` (src/mva/zoo/modal_apps/ntv2.py). The weights are pulled at the pinned
# Hugging Face commit in the app's REVISION; `digest` is the sha256 tree the container
# measured over model.safetensors on first load (smoke run, 2026-09-23) — measured, not typed.
#
# Score: cosine distance between the mean final-layer embeddings of the ref and alt windows
# (the NT paper's zero-shot embedding comparison). 0 = no change seen, higher = more changed,
# so `score_sign = +1`. The masked 6-mer log-likelihood ratio rides in `aux.llr` for SNVs.
#
# `window = 6144` bases = 1,024 six-mer tokens, allele at offset 3072 (a token boundary).
# L4, fp16 autocast: 0.335 GPU s/record measured; fp32 (0.63 s/record) would overrun the $6
# share. fp16 vs fp32 on 256 records: Spearman 0.994 (score), 0.99998 (llr). Entry 144.
[models.ntv2]
enabled = true
params = { image = "nt-v2", gpu = "L4", needs = [
  "dna_window_ref",
  "dna_window_alt",
], batch = 32, wave = 8, window = 6144, score_sign = 1, digest = "86a1b8144af071a923f0334456c86bd3b043eab43881f5aee2dd7f5a76947b66" }
