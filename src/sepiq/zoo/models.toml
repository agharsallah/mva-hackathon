# The zoo roster: one table per model, keyed by `key`.
#
# This file holds the shared roster. A later lane, or a measured weights digest, arrives
# as a fragment in `models.d/<key>.toml` so two people adding two lanes never edit one
# file. A fragment adds a model or overrides fields of one already here (top-level fields
# replace, `params` merges key by key); two fragments claiming one key is an error.
#
# `sepiq.zoo.registry` parses and validates this file. The field meanings:
#
#   name               what the publishers call it
#   version            the exact release scored against — never "latest"
#   tier               1 = precomputed table lookup, 2 = local CPU, 3 = remote GPU
#   input_class        sequence | pair | structure  (what the lane reads)
#   source             table | rest | local-process | modal
#   adapter            the module that speaks that source
#   licence            SPDX id or the publisher's own name for it
#   non_commercial     true if the terms forbid commercial use — it changes what ships
#   catalogue_adjacent true if trained on the same public data an evaluation is drawn
#                      from; such a lane is reported separately, because its agreement
#                      may be recall rather than prediction
#   scope              mvp | opt-a | opt-b  (rollout bucket)
#   enabled            false parks a card without deleting it
#   pmid               the paper, so a reader can check the claim
#
# The roster is EMPTY on purpose: no model has been chosen for this challenge yet, and a
# card is a claim about a published artefact that must be checked before it is written.
# The block below is a disabled template showing the shape — it names no real model.

[models.example]
key = "example"
name = "Template lane — not a real model"
version = "0.0.0"
tier = 3
input_class = "pair"
source = "modal"
adapter = "modal"
licence = "UNSET"
licence_url = ""
non_commercial = false
catalogue_adjacent = false
scope = "mvp"
enabled = false
pmid = ""
notes = """
Copy this block, fill every field from the model's own README and licence file, and set
enabled = true once an adapter exists. Delete this template when the first real card
lands.
"""

[models.example.params]
image = "unset"
