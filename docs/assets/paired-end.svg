<svg xmlns="http://www.w3.org/2000/svg" width="760" height="232" viewBox="0 0 760 232" role="img" aria-label="Paired-end reads and insert size"><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111}
.b{stroke:#333;stroke-width:1.5;fill:none}
.g{stroke:#999;stroke-width:1;fill:none}
</style><rect x="0.5" y="0.5" width="759" height="231" rx="10" fill="#ffffff" stroke="#d5d5d5"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c00"/></marker></defs><text xml:space="preserve" x="20" y="32" font-size="15px" text-anchor="start" font-weight="700">Paired-end reads: two ends of the same scrap</text><rect x="70" y="92" width="620" height="20" rx="4" fill="#e6e6e6" stroke="#333"/><rect x="70" y="92" width="160" height="20" rx="4" fill="#cfe8ff" stroke="#333"/><rect x="530" y="92" width="160" height="20" rx="4" fill="#ffd8a8" stroke="#333"/><line x1="160" y1="128" x2="236" y2="128" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="600" y1="128" x2="524" y2="128" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text xml:space="preserve" x="150" y="84" font-size="11px" text-anchor="middle" fill="#555">R1 - 150 letters</text><text xml:space="preserve" x="610" y="84" font-size="11px" text-anchor="middle" fill="#555">R2 - 150 letters</text><text xml:space="preserve" x="380" y="106" font-size="11px" text-anchor="middle" fill="#555">middle: never read</text><text xml:space="preserve" x="380" y="150" font-size="11px" text-anchor="middle" fill="#555">but its LENGTH is known - and that is the trick</text><rect x="20" y="172" width="720" height="46" rx="6" fill="#ffe9b3" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="380" y="192" font-size="12px" text-anchor="middle">If R1 and R2 land FURTHER apart on the reference than expected, a deletion is hiding between</text><text xml:space="preserve" x="380" y="209" font-size="12px" text-anchor="middle">them. That is how SV callers work.</text></svg>