name: CI

# Two independent projects share this repo: the app/ React app (npm) and the
# root Python package (uv). Each gets its own job so a Python-only change
# does not wait on `pnpm install`, and vice versa. Both jobs run on every push and
# every pull request, mirroring the local pre-push gate exactly.
on:
  push:
    branches: [main]
  pull_request:

# Cancel a run that a newer push on the same branch/PR has already superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm is pinned by app/package.json's "packageManager" field, so the
      # action installs exactly the version developers run locally. Node comes
      # from "engines".
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: app/package.json
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # --frozen-lockfile refuses to update pnpm-lock.yaml: the lockfile in the
      # repo is exactly what gets installed, or the step fails loudly.
      - name: Install dependencies (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc -b)
        run: pnpm run typecheck

      # lint:strict is `eslint . --max-warnings 0`: the repo is at zero warnings as of
      # 2026-09-02, so a new warning fails the build instead of accumulating.
      - name: Lint (eslint, zero warnings)
        run: pnpm run lint:strict

      - name: Format check (prettier --check)
        run: pnpm run format:check

      - name: Test (vitest run)
        run: pnpm run test

      - name: Build (tsc -b && vite build)
        run: pnpm run build

      # tools/bundle-budget.mjs is owned by a different in-flight change; the
      # step still runs by path so it activates the moment that file lands,
      # with a visible (not silently green) notice until then.
      - name: Bundle budget
        run: |
          if [ -f tools/bundle-budget.mjs ]; then
            node tools/bundle-budget.mjs
          else
            echo "::warning title=bundle-budget not wired::app/tools/bundle-budget.mjs does not exist yet — skipping the bundle-budget gate. Remove this guard once it lands."
          fi

      # Dead-code scan: report-only for now (see app/knip.json / CONTRIBUTING.md
      # for why). Never fails the job — `|| true` — until the existing findings
      # are triaged.
      - name: Dead code report (knip)
        if: always()
        run: pnpm exec knip --reporter compact || true

  python:
    name: python (uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen refuses to touch uv.lock: the lockfile committed to the repo
      # is exactly what gets installed, or the step fails loudly instead of
      # silently re-resolving.
      - name: Sync dependencies (uv sync --frozen)
        run: uv sync --frozen

      # Order matters: the cheap, deterministic gates run before the 20-second test
      # suite so a formatting or import-layering mistake fails in seconds.
      - name: Format check (ruff format --check)
        run: uv run ruff format --check src tests tools

      - name: Lint (ruff check)
        run: uv run ruff check src tests tools

      - name: Module size (400 lines in src, 600 in tests)
        run: uv run python tools/check_module_size.py

      # The package layering documented in src/mva/README.md. Without this the
      # dependency diagram is a picture nothing checks.
      - name: Import layering (lint-imports)
        run: uv run lint-imports

      - name: Typecheck (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest

  # The history gate. Runs the same script the .husky/commit-msg hook runs, so a
  # commit written with --no-verify (or on a machine whose hooks were never
  # wired) still cannot reach main with a broken message — or with a genomic
  # position in it, which no later cleanup can remove from history.
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the gate walks a commit range, which needs real history.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test the gate
        run: sh tools/check-commit-msg.sh --self-test

      # Pull request: every commit the branch adds on top of its base.
      - name: Check the pull request's commits
        if: github.event_name == 'pull_request'
        run: sh tools/check-commit-msg.sh --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      # Push to main: only the commits this push added. `github.event.before` is
      # all-zeroes for a branch's first push and after a force-push; there is no
      # range to check in that case, so the step says so instead of failing.
      - name: Check the pushed commits
        if: github.event_name == 'push'
        run: |
          before='${{ github.event.before }}'
          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "::notice title=no range::no usable 'before' SHA for this push — skipping the range check"
            exit 0
          fi
          sh tools/check-commit-msg.sh --range "$before..${{ github.sha }}"
