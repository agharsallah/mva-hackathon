<svg xmlns="http://www.w3.org/2000/svg" width="760" height="334" viewBox="0 0 760 334" role="img" aria-label="Recessive inheritance pedigree"><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111}
.b{stroke:#333;stroke-width:1.5;fill:none}
.g{stroke:#999;stroke-width:1;fill:none}
</style><rect x="0.5" y="0.5" width="759" height="333" rx="10" fill="#ffffff" stroke="#d5d5d5"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c00"/></marker></defs><text xml:space="preserve" x="20" y="32" font-size="15px" text-anchor="start" font-weight="700">Recessive: two healthy parents, one sick child</text><rect x="226" y="66" width="48" height="48" fill="#fff" stroke="#333" stroke-width="2"/><path d="M226,66 L250,66 L250,114 L226,114 z" fill="#ffe9b3"/><circle cx="474" cy="90" r="24" fill="#fff" stroke="#333" stroke-width="2"/><path d="M474,66 A24,24 0 0,0 474,114 z" fill="#ffe9b3"/><line x1="274" y1="90" x2="450" y2="90" stroke="#333" stroke-width="2"/><line x1="362" y1="90" x2="362" y2="150" stroke="#333" stroke-width="2"/><line x1="280" y1="150" x2="444" y2="150" stroke="#333" stroke-width="2"/><line x1="280" y1="150" x2="280" y2="176" stroke="#333" stroke-width="2"/><line x1="444" y1="150" x2="444" y2="176" stroke="#333" stroke-width="2"/><rect x="256" y="176" width="48" height="48" fill="#ff9999" stroke="#333" stroke-width="2"/><circle cx="444" cy="200" r="24" fill="#fff" stroke="#333" stroke-width="2"/><line x1="222" y1="232" x2="252" y2="210" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text xml:space="preserve" x="206" y="84" font-size="11px" text-anchor="end" fill="#555">DAD</text><text xml:space="preserve" x="206" y="98" font-size="10px" text-anchor="end" fill="#555">carrier of V2</text><text xml:space="preserve" x="206" y="111" font-size="10px" text-anchor="end" fill="#555">healthy</text><text xml:space="preserve" x="514" y="84" font-size="11px" text-anchor="start" fill="#555">MUM</text><text xml:space="preserve" x="514" y="98" font-size="10px" text-anchor="start" fill="#555">carrier of V1</text><text xml:space="preserve" x="514" y="111" font-size="10px" text-anchor="start" fill="#555">healthy</text><text xml:space="preserve" x="280" y="246" font-size="11px" text-anchor="middle" fill="#555">THE CHILD</text><text xml:space="preserve" x="280" y="259" font-size="10px" text-anchor="middle" fill="#555">V1 + V2 = MVA</text><text xml:space="preserve" x="444" y="246" font-size="11px" text-anchor="middle" fill="#555">sibling</text><text xml:space="preserve" x="444" y="259" font-size="10px" text-anchor="middle" fill="#555">got 2 clean copies</text><rect x="20" y="274" width="720" height="46" rx="6" fill="#cfe8ff" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="380" y="294" font-size="12px" text-anchor="middle">Nobody in the family is ill. Nothing in the family history predicts this. That is what</text><text xml:space="preserve" x="380" y="311" font-size="12px" text-anchor="middle">recessive looks like.</text></svg>