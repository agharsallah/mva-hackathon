<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" role="img" aria-label="Hardy Weinberg and why the allele must be rare"><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111}
.b{stroke:#333;stroke-width:1.5;fill:none}
.g{stroke:#999;stroke-width:1;fill:none}
</style><rect x="0.5" y="0.5" width="759" height="355" rx="10" fill="#ffffff" stroke="#d5d5d5"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c00"/></marker></defs><text xml:space="preserve" x="20" y="32" font-size="15px" text-anchor="start" font-weight="700">Why the answer has to be an ultra-rare allele</text><text xml:space="preserve" x="80" y="60" font-size="10px" text-anchor="start" fill="#555">from MUM</text><rect x="80" y="86" width="122" height="122" fill="#ccebc5" stroke="#333"/><rect x="202" y="86" width="48" height="122" fill="#ffe9b3" stroke="#333"/><rect x="80" y="208" width="122" height="48" fill="#ffe9b3" stroke="#333"/><rect x="202" y="208" width="48" height="48" fill="#ff9999" stroke="#333"/><text xml:space="preserve" x="141" y="147" font-size="10px" text-anchor="middle" fill="#555">healthy</text><text xml:space="preserve" x="226" y="147" font-size="10px" text-anchor="middle" fill="#555">carrier</text><text xml:space="preserve" x="141" y="236" font-size="10px" text-anchor="middle" fill="#555">carrier</text><text xml:space="preserve" x="226" y="274" font-size="10px" text-anchor="middle" fill="#555">q x q</text><text xml:space="preserve" x="72" y="147" font-size="10px" text-anchor="end" fill="#555">clean</text><text xml:space="preserve" x="72" y="226" font-size="10px" text-anchor="end" fill="#555">broken</text><text xml:space="preserve" x="72" y="78" font-size="10px" text-anchor="end" fill="#555">from DAD</text><text xml:space="preserve" x="300" y="86" font-size="13px" text-anchor="start">q = how often a broken allele appears in the population</text><text xml:space="preserve" x="300" y="107" font-size="13px" text-anchor="start">affected by chance = q x q</text><text xml:space="preserve" x="300" y="149" font-size="11px" text-anchor="start" fill="#555">if q = 1 in 10,000   ->   q x q = 1 in 100,000,000</text><text xml:space="preserve" x="300" y="170" font-size="11px" text-anchor="start" fill="#555">8 billion people      ->   about 80 affected worldwide</text><text xml:space="preserve" x="300" y="212" font-size="11px" text-anchor="start" fill="#555">MVA has under 50 known patients EVER, so the real alleles</text><text xml:space="preserve" x="300" y="233" font-size="11px" text-anchor="start" fill="#555">are rarer still - basically absent from gnomAD.</text><text xml:space="preserve" x="300" y="275" font-size="11px" text-anchor="start" fill="#555">compound het of two DIFFERENT alleles: chance = 2 x p1 x p2</text><rect x="20" y="296" width="720" height="46" rx="6" fill="#ffcccc" stroke="#333" stroke-width="1.5"/><text xml:space="preserve" x="380" y="316" font-size="12px" text-anchor="middle">Practical filter: any candidate with a gnomAD frequency above 1 in 10,000 is almost certainly</text><text xml:space="preserve" x="380" y="333" font-size="12px" text-anchor="middle">NOT the answer.</text></svg>