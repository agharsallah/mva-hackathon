# src/mva/zoo/models.d/esm1b.toml — written from a measured fetch (methodology entry 119).
#
# `sha256` is the digest of the downloaded archive, printed by
# `tools/fetch_zoo_tables.py --fetch esm1b --execute` and reproduced on a second download.
#
# `adapter` overrides the roster's `duckdb_lookup`. ESM1b's table is keyed by a UniProt
# accession and a one-letter residue change (`R550Q`); the allele record carries neither —
# `uniprot` is null for every record because Ensembl's POST endpoint will not serve
# `uniprot=1` (entry 114), and `hgvs_p` is Ensembl-flavoured and three-letter. The
# `protein_table` lane is the translation, joining through the gene symbol with the
# wild-type residue inside the key so a wrong isoform cannot match.
#
# `gene_map` is the accession → gene table the publisher ships inside the same archive
# (`contents_u_df.csv`), so it carries the archive's digest as its provenance.
#
# `parquet` holds only the members whose accession belongs to a gene this case carries —
# the plan's tier-1 rule (§10 R7), and the reason the conversion is minutes not hours.
[models.esm1b]
adapter = "protein_table"
params = { sha256 = "42b90ce74a007ce7147f8e4be4035fe7f11881215fecce0983441cc229207cd0", gene_map = "build/it4/tables/esm1b.genes.csv", map_accession = "id", map_gene = "gene" }
